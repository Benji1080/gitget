name: gitget

on:
  workflow_dispatch:   # manual trigger
  # schedule:          # uncomment to run automatically (e.g., weekly)
  #   - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout your own repository
      - name: Checkout my repo
        uses: actions/checkout@v4

      # 2. Download the release asset(s) from the other repository
      - name: Download release asset(s)
        env:
          # The default GITHUB_TOKEN works for public repos.
          # If the source repo was private, you would need a PAT
          # stored as a secret (e.g., SOURCE_TOKEN) and pass it here.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ─── CONFIGURE THESE THREE VARIABLES ──────────────────
          SOURCE_REPO="jely2002/youtube-dl-gui"
          SOURCE_TAG="v3.2.0"                     # ← check the exact tag name!
          ASSETS="Open.Video.Downloader_3.2.0_x64-portable.zip"
          # To download multiple files, separate with commas:
          # ASSETS="file1.zip,file2.tar.gz"
          # To download ALL assets from the release, use:
          # ASSETS="*"

          # ─── Download logic ───────────────────────────────────
          if [ "$ASSETS" = "*" ] || [ "$ASSETS" = "all" ]; then
            echo "⬇️ Downloading ALL assets from ${SOURCE_REPO}@${SOURCE_TAG} ..."
            gh release download "$SOURCE_TAG" \
              --repo "$SOURCE_REPO" \
              --pattern '*'
          else
            IFS=',' read -ra FILES <<< "$ASSETS"
            for file in "${FILES[@]}"; do
              file=$(echo "$file" | xargs)   # trim whitespace
              echo "⬇️ Downloading: $file"
              gh release download "$SOURCE_TAG" \
                --repo "$SOURCE_REPO" \
                --pattern "$file"
            done
          fi

      # 3. Commit and push the new file(s) to your repository
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Add release asset(s) from external repo'
          branch: main
