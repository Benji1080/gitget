name: gitget

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4

      # ───── DIAGNOSTIC: Show available assets ─────
      - name: List source release assets (for debugging)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # not needed for public repos
        run: |
          echo "Checking release tag: v3.2.0"
          gh release view v3.2.0 --repo jely2002/youtube-dl-gui --json assets --jq '.assets[].name' || echo "❌ Tag not found, or no assets. Check the exact tag name on: https://github.com/jely2002/youtube-dl-gui/releases"

      # ───── DOWNLOAD ─────
      - name: Download release asset(s)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_REPO="jely2002/youtube-dl-gui"
          SOURCE_TAG="v3.2.0"                     # ← CHANGE THIS IF THE TAG IS "3.2.0" (no v)
          ASSETS="Open.Video.Downloader_3.2.0_x64-portable.zip"
          # ASSETS="*"   # for all files

          if [ "$ASSETS" = "*" ]; then
            echo "⬇️ Downloading ALL assets..."
            gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern '*'
          else
            IFS=',' read -ra FILES <<< "$ASSETS"
            for file in "${FILES[@]}"; do
              file=$(echo "$file" | xargs)   # trim whitespace
              if [ -z "$file" ]; then continue; fi
              echo "⬇️ Downloading: '$file'"
              gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern "$file" || {
                echo "❌ Failed to download '$file'. Check if the filename is correct (case‑sensitive)."
                echo "Available assets (from previous step above) can help you verify the name."
                exit 1
              }
            done
          fi

      # ───── COMMIT AND PUSH ─────
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Add release asset(s) from external repo'
          branch: main
